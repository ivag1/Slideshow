<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson 11 - JavaScript Slideshow</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    #slideImage { width: 80%; max-width: 600px; height: 350px; object-fit: cover; }
    .buttons { margin-top: 15px; }
    button { margin: 5px; padding: 10px 15px; cursor: pointer; }
    #allImages { margin-top: 20px; }
    .small-image { width: 100px; height: 60px; object-fit: cover; margin: 5px; cursor: pointer; }
    .active { border: 3px solid red; }
  </style>
</head>
<body>
  <h1>Lesson 11: JavaScript Slideshow</h1>
  <p>Click buttons or autoplay the slideshow.</p>

  <img id="slideImage" src="" alt="Slideshow image" />
  <p id="imageCaption"></p>
  <p id="imageCounter"></p>

  <div class="buttons">
    <button onclick="previousImage()">Previous</button>
    <button onclick="nextImage()">Next</button>
    <button onclick="startSlideshow()">Start slideshow</button>
    <button onclick="stopSlideshow()">Stop</button>
  </div>

  <div id="allImages"></div>

  <script>
    const images = [
      { src: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80", caption: "Mountain and nature" },
      { src: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80", caption: "Ocean waves" },
      { src: "https://images.unsplash.com/photo-1493244040629-496f6d136cc3?auto=format&fit=crop&w=1200&q=80", caption: "Forest path" },
      { src: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80", caption: "Snowy mountains" },
      { src: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80", caption: "Desert dunes" }
    ];

    let currentImage = 0;
    let slideshowInterval;

    function showImage(index) {
      const img = images[index];
      document.getElementById("slideImage").src = img.src;
      document.getElementById("imageCaption").textContent = img.caption;
      document.getElementById("imageCounter").textContent = `Image ${index + 1} of ${images.length}`;
      const thumbs = document.querySelectorAll(".small-image");
      thumbs.forEach((thumb, i) => {
        thumb.classList.toggle("active", i === index);
      });
    }

    function nextImage() {
      currentImage = (currentImage + 1) % images.length;
      showImage(currentImage);
    }

    function previousImage() {
      currentImage = (currentImage - 1 + images.length) % images.length;
      showImage(currentImage);
    }

    function startSlideshow() {
      stopSlideshow();
      slideshowInterval = setInterval(nextImage, 2000);
    }

    function stopSlideshow() {
      clearInterval(slideshowInterval);
    }

    function showSmallImages() {
      const container = document.getElementById("allImages");
      images.forEach((img, index) => {
        const thumb = document.createElement("img");
        thumb.src = img.src;
        thumb.className = "small-image";
        thumb.onclick = () => {
          currentImage = index;
          showImage(currentImage);
        };
        container.appendChild(thumb);
      });
    }

    showSmallImages();
    showImage(currentImage);
  </script>
</body>
</html>
